<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Derivatives course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@300;400;600&family=Unbounded:wght@400;600&display=swap" rel="stylesheet">
<style>
/* A course reader in the hub's palette. Left: the syllabus as a module list with
   progress. Right: whichever page is open (overview, a module's lessons and quiz,
   the calculators, or the reading list). Course text lives in course.js; progress
   and quiz answers are kept in this browser. */
:root {
  --bg: #071A16; --panel: #0E2A23; --line: #2A5A4B; --text: #E4F2E6; --muted: #93B5A5;
  --leaf: #7BE0A0; --sun: #F4C453; --down: #FF8F7A;
  --font-display: "Unbounded", "Trebuchet MS", sans-serif;
  --font-body: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-weight: 300; font-size: 16px; line-height: 1.6;
  background-image: radial-gradient(900px 500px at 85% -10%, rgba(244, 196, 83, .10), transparent 70%); background-attachment: fixed; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 56px; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
b, strong { font-weight: 600; }
a { color: var(--leaf); }
.top { padding: 20px 0; border-bottom: 1px solid var(--line); }
.top a { color: var(--muted); text-decoration: none; }
.top a:hover { color: var(--leaf); }
.eyebrow { color: var(--sun); margin: 32px 0 8px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(24px, 3.6vw, 36px); line-height: 1.15; letter-spacing: -.02em; margin: 0 0 12px; max-width: 24ch; text-wrap: balance; }
.lede { color: var(--muted); max-width: 66ch; margin: 0 0 24px; }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 32px; align-items: start; }
nav.side { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
nav.side a { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 14.5px; line-height: 1.35; }
nav.side a:hover { background: rgba(123, 224, 160, .08); }
nav.side a[aria-current="page"] { background: var(--panel); box-shadow: inset 2px 0 0 var(--sun); }
nav.side .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
nav.side .p { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
nav.side a.done .p { color: var(--leaf); }
nav.side .grp { color: var(--muted); padding: 14px 10px 4px; }
.meter { height: 6px; border-radius: 3px; background: rgba(147, 181, 165, .22); overflow: hidden; margin: 6px 10px 4px; }
.meter i { display: block; height: 100%; background: var(--leaf); border-radius: 3px; }
main h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.2; margin: 0 0 6px; }
main h3 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
.sub { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin-bottom: 16px; }
.panel p { margin: 0 0 12px; max-width: 72ch; }
.panel p:last-child, .panel ul:last-child { margin-bottom: 0; }
.panel ul { margin: 0 0 12px; padding-left: 20px; max-width: 72ch; }
.panel li { margin-bottom: 6px; }
.lhead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 10px; }
.lhead label { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; white-space: nowrap; }
.lhead input { width: 18px; height: 18px; accent-color: var(--leaf); margin: 0; }
.formula { font-family: var(--font-mono); font-size: 14.5px; background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--sun); border-radius: 6px; padding: 12px 14px; margin: 0 0 12px; white-space: pre-wrap; overflow-x: auto; }
.formula small { display: block; font-family: var(--font-body); color: var(--muted); font-size: 13px; margin-top: 6px; white-space: normal; }
.example { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 16px; margin: 0 0 12px; }
.example .mono { color: var(--leaf); display: block; margin-bottom: 6px; }
.example ol { margin: 0; padding-left: 20px; }
.table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.table th { text-align: left; font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); }
.table td { padding: 8px 12px 8px 0; border-bottom: 1px solid rgba(42, 90, 75, .6); vertical-align: top; }
.table td.r, .table th.r { text-align: right; white-space: nowrap; }
.q { padding: 14px 0; border-top: 1px solid rgba(42, 90, 75, .6); }
.q:first-of-type { border-top: 0; padding-top: 0; }
.q p { margin: 0 0 8px; font-weight: 400; }
.q label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
.q label:hover { border-color: var(--leaf); }
.q input { margin: 5px 0 0; accent-color: var(--sun); }
.q label.right { border-color: var(--leaf); background: rgba(123, 224, 160, .1); }
.q label.wrong { border-color: var(--down); background: rgba(255, 143, 122, .08); }
.q .why { color: var(--muted); font-size: 14.5px; margin: 6px 0 0; }
.q .why b { color: var(--text); }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.btn { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; color: var(--text); text-decoration: none; font-size: 14.5px; }
.btn:hover { border-color: var(--leaf); color: var(--leaf); }
.btn.primary { background: var(--sun); border-color: var(--sun); color: #1A1400; font-weight: 600; }
.warn { border-left: 3px solid var(--down); padding-left: 14px; color: var(--muted); font-size: 14.5px; max-width: 76ch; }
/* calculators */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 14px; margin-bottom: 14px; }
.form label { display: block; color: var(--muted); font-size: 13px; }
.form input, .form select { display: block; width: 100%; margin-top: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--text); font-size: 15px; }
.form input { font-family: var(--font-mono); }
.out { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px; }
.out div span { display: block; color: var(--muted); font-size: 13px; }
.out div b { font-family: var(--font-mono); font-weight: 500; font-size: 20px; }
.neg { color: var(--down); } .pos { color: var(--leaf); }
.legs { display: grid; gap: 8px; margin-bottom: 12px; }
.leg { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr auto; gap: 8px; align-items: end; }
.leg label { color: var(--muted); font-size: 12.5px; }
.leg input, .leg select { display: block; width: 100%; margin-top: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; font-size: 14px; font-family: var(--font-mono); color: var(--text); }
.leg button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; color: var(--muted); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .read { position: absolute; top: 6px; right: 8px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); background: rgba(7, 26, 22, .85); padding: 2px 6px; border-radius: 4px; }
footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; max-width: 84ch; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } nav.side { position: static; max-height: none; border: 1px solid var(--line); border-radius: 14px; padding: 6px; } .wrap { padding: 0 16px 48px; } .leg { grid-template-columns: 1fr 1fr; } }
@media print { nav.side, .top, .btnrow, footer { display: none; } body { background: #fff; color: #000; } .panel { border-color: #999; background: #fff; } .layout { display: block; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="mono" href="../../">← Back to hub</a></header>
  <div class="eyebrow mono">Education · Course 1</div>
  <h1 id="title"></h1>
  <p class="lede" id="blurb"></p>
  <div class="layout">
    <nav class="side" id="side" aria-label="Syllabus"></nav>
    <main id="main"></main>
  </div>
  <footer id="foot"></footer>
</div>

<script src="course.js"></script>
<script>
"use strict";
const C = window.COURSE, KEY = "edu-derivatives";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const usd = (v, d = 0) => (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const fix = (v, d = 2) => isFinite(v) ? v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }) : "–";
let P = { done: {}, quiz: {} };
try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && typeof v === "object") P = Object.assign(P, v); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };
const TOOLS = { position: "Position and sizing", carry: "Cost of carry", hedge: "Hedge ratio", payoff: "Payoff builder", black: "Option pricer" };
const lessonsDone = (m) => m.lessons.filter((l) => P.done[l.id]).length;
const quizScore = (m) => { const a = P.quiz[m.id] || {}; return m.quiz.filter((q, i) => a[i] === q.a).length; };
const quizTried = (m) => Object.keys(P.quiz[m.id] || {}).length;
const complete = (m) => lessonsDone(m) === m.lessons.length && quizTried(m) === m.quiz.length;
const route = () => { const h = location.hash.slice(1); return h || "syllabus"; };

function side() {
  const s = $("side"), r = route(); s.textContent = "";
  const all = C.modules.flatMap((m) => m.lessons), done = all.filter((l) => P.done[l.id]).length;
  const link = (href, n, text, p, cls) => { const a = el("a", cls || ""); a.href = "#" + href; if (r === href || (href === "tools" && r.startsWith("tool-"))) a.setAttribute("aria-current", "page"); a.append(el("span", "n", n), el("span", null, text), el("span", "p", p || "")); return a; };
  s.appendChild(link("syllabus", "·", "Syllabus and how to use it", ""));
  const meter = el("div", "meter"), bar = el("i"); bar.style.width = done / all.length * 100 + "%"; meter.appendChild(bar);
  s.append(el("div", "grp mono", "Modules · " + done + " of " + all.length + " lessons"), meter);
  C.modules.forEach((m, i) => s.appendChild(link(m.id, String(i + 1).padStart(2, "0"), m.title, complete(m) ? "✓ done" : lessonsDone(m) + "/" + m.lessons.length, complete(m) ? "done" : "")));
  s.appendChild(el("div", "grp mono", "Workbench"));
  s.appendChild(link("tools", "∑", "Calculators", "")); s.appendChild(link("reading", "§", "Reading list", ""));
}

function block(b) {
  if (typeof b === "string") return el("p", null, b);
  if (b.f) { const d = el("div", "formula", b.f); if (b.note) d.appendChild(el("small", null, b.note)); return d; }
  if (b.ex) { const d = el("div", "example"), ol = el("ol"); d.appendChild(el("span", "mono", "Worked example · " + b.ex)); b.lines.forEach((t) => ol.appendChild(el("li", null, t))); d.appendChild(ol); return d; }
  if (b.list) { const ul = el("ul"); b.list.forEach((t) => ul.appendChild(el("li", null, t))); return ul; }
  return el("p");
}

function syllabus(main) {
  main.append(el("h2", null, "Syllabus"), el("p", "sub", C.weeks + " modules, about " + C.modules.reduce((a, m) => a + m.hours, 0) + " hours of study. One module a week is a comfortable pace."));
  const p0 = el("div", "panel"); p0.appendChild(el("h3", null, "By the end you will be able to")); const ul = el("ul"); C.outcomes.forEach((t) => ul.appendChild(el("li", null, t))); p0.appendChild(ul); main.appendChild(p0);
  const p1 = el("div", "panel"), t = el("table", "table"), hr = el("tr"); ["", "Module", "You will be able to", "Hours"].forEach((h, i) => hr.appendChild(el("th", i === 3 ? "r" : "", h))); t.appendChild(hr);
  C.modules.forEach((m, i) => { const tr = el("tr"), td = el("td"), a = el("a", null, m.title); a.href = "#" + m.id; td.appendChild(a); tr.append(el("td", "num", String(i + 1).padStart(2, "0")), td, el("td", null, m.goal), el("td", "r num", String(m.hours))); t.appendChild(tr); });
  p1.append(el("h3", null, "The twelve modules"), t); main.appendChild(p1);
  const p2 = el("div", "panel"); p2.appendChild(el("h3", null, "How to use this course")); const u2 = el("ul"); C.how.forEach((x) => u2.appendChild(el("li", null, x))); p2.appendChild(u2); main.appendChild(p2);
  main.appendChild(el("p", "warn", C.warning));
  const next = C.modules.find((m) => !complete(m)); if (next) { const row = el("div", "btnrow"), a = el("a", "btn primary", (lessonsDone(C.modules[0]) ? "Continue: " : "Start: ") + next.title); a.href = "#" + next.id; row.appendChild(a); main.appendChild(row); }
}

function moduleView(main, m) {
  const i = C.modules.indexOf(m);
  main.append(el("div", "mono", "Module " + (i + 1) + " of " + C.modules.length + " · about " + m.hours + " hours"), el("h2", null, m.title), el("p", "sub", "Goal: " + m.goal));
  main.firstChild.style.color = "var(--muted)"; main.firstChild.style.marginBottom = "6px";
  m.lessons.forEach((l, k) => {
    const p = el("article", "panel"), head = el("div", "lhead"), lab = el("label"), cb = el("input"); cb.type = "checkbox"; cb.checked = !!P.done[l.id];
    cb.addEventListener("change", () => { P.done[l.id] = cb.checked; save(); side(); }); lab.append(cb, "Done");
    head.append(el("h3", null, (i + 1) + "." + (k + 1) + "  " + l.title), lab); p.appendChild(head); l.body.forEach((b) => p.appendChild(block(b))); main.appendChild(p);
  });
  if (m.tools && m.tools.length) { const p = el("div", "panel"), row = el("div", "btnrow"); row.style.marginTop = "8px"; p.append(el("h3", null, "Try it"), el("p", null, "Calculators for this module:")); m.tools.forEach((t) => { const a = el("a", "btn", TOOLS[t]); a.href = "#tool-" + t; row.appendChild(a); }); p.appendChild(row); main.appendChild(p); }
  if (m.practice && m.practice.length) { const p = el("div", "panel"), ul = el("ul"); m.practice.forEach((t) => ul.appendChild(el("li", null, t))); p.append(el("h3", null, "Practice"), ul); main.appendChild(p); }
  const qp = el("div", "panel"), score = el("p", "sub"); score.style.margin = "0 0 12px"; qp.append(el("h3", null, "Check yourself"), score);
  const ans = P.quiz[m.id] || (P.quiz[m.id] = {});
  const upd = () => { score.textContent = quizTried(m) ? "Score: " + quizScore(m) + " of " + m.quiz.length + (quizTried(m) < m.quiz.length ? " so far" : "") : "Pick an answer to see the explanation."; };
  m.quiz.forEach((q, qi) => {
    const box = el("div", "q"), why = el("p", "why"); box.appendChild(el("p", null, (qi + 1) + ". " + q.q));
    const labels = q.options.map((o, oi) => { const lab = el("label"), r = el("input"); r.type = "radio"; r.name = m.id + "-" + qi; r.checked = ans[qi] === oi; r.addEventListener("change", () => { ans[qi] = oi; save(); mark(); upd(); side(); }); lab.append(r, el("span", null, o)); box.appendChild(lab); return lab; });
    const mark = () => { labels.forEach((l, oi) => { l.className = ans[qi] == null ? "" : oi === q.a ? "right" : oi === ans[qi] ? "wrong" : ""; }); why.textContent = ""; if (ans[qi] != null) { why.append(el("b", null, ans[qi] === q.a ? "Correct. " : "Not quite. "), q.why); } };
    mark(); box.appendChild(why); qp.appendChild(box);
  });
  upd(); main.appendChild(qp);
  const nav = el("div", "btnrow"), prev = C.modules[i - 1], next = C.modules[i + 1];
  if (prev) { const a = el("a", "btn", "← " + prev.title); a.href = "#" + prev.id; nav.appendChild(a); }
  if (next) { const a = el("a", "btn primary", "Next: " + next.title + " →"); a.href = "#" + next.id; nav.appendChild(a); } else { const a = el("a", "btn primary", "Back to the syllabus"); a.href = "#syllabus"; nav.appendChild(a); }
  main.appendChild(nav);
}

/* ---------- calculators ---------- */
const field = (label, value, opts = {}) => { const lab = el("label", null, label), inp = el(opts.options ? "select" : "input"); if (opts.options) opts.options.forEach(([v, t]) => { const o = el("option", null, t); o.value = v; inp.appendChild(o); }); else { inp.type = "number"; inp.step = opts.step || "any"; } inp.value = value; lab.appendChild(inp); return [lab, inp]; };
const outBox = (pairs) => { const o = el("div", "out"); pairs.forEach(([k, v, cls]) => { const d = el("div"); d.append(el("span", null, k), el("b", cls || "", v)); o.appendChild(d); }); return o; };
const CONTRACTS = { hg: ["COMEX copper (25,000 lb, $/lb)", 25000, 0.0005, 5.0, 4.9, 9000], lmecu: ["LME copper (25 t, $/t)", 25, 0.5, 11000, 10800, 20000], lmeal: ["LME aluminium (25 t, $/t)", 25, 0.5, 3000, 2950, 6000], hrc: ["US hot-rolled coil (20 short tons, $/ton)", 20, 1, 1000, 950, 2500], custom: ["Custom contract", 1, 0.01, 100, 99, 1000] };
function toolPosition(box) {
  const f = el("div", "form"), out = el("div");
  const [l0, c] = field("Contract", "hg", { options: Object.entries(CONTRACTS).map(([k, v]) => [k, v[0]]) }), [l1, sd] = field("Side", "1", { options: [["1", "Long (bought)"], ["-1", "Short (sold)"]] }), [l2, n] = field("Contracts", 2), [l3, en] = field("Entry price", 5), [l4, ex] = field("Exit price", 4.9), [l5, mg] = field("Margin per contract, $", 9000), [l6, sz] = field("Contract size", 25000), [l7, tk] = field("Tick size", 0.0005);
  f.append(l0, l1, l2, l3, l4, l5, l6, l7);
  const calc = () => { const size = +sz.value, q = +n.value, pnl = (+ex.value - +en.value) * size * q * +sd.value, notional = +en.value * size * q, margin = +mg.value * q; out.textContent = "";
    out.appendChild(outBox([["Value of one contract", usd(+en.value * size)], ["One tick is worth", usd(+tk.value * size, 2)], ["Position value", usd(notional)], ["Profit or loss", usd(pnl), pnl < 0 ? "neg" : "pos"], ["As a share of margin", margin ? fix(pnl / margin * 100, 1) + "%" : "–", pnl < 0 ? "neg" : "pos"], ["Leverage", margin ? fix(notional / margin, 1) + "×" : "–"]])); };
  c.addEventListener("change", () => { const v = CONTRACTS[c.value]; sz.value = v[1]; tk.value = v[2]; en.value = v[3]; ex.value = v[4]; mg.value = v[5]; calc(); });
  [sd, n, en, ex, mg, sz, tk].forEach((i) => i.addEventListener("input", calc)); calc();
  box.append(el("p", null, "What a price move means in dollars. Margin figures are placeholders; use your broker's current number."), f, out);
  const f2 = el("div", "form"), out2 = el("div"), [a0, cap] = field("Capital, $", 200000), [a1, rk] = field("Risk per trade, %", 1), [a2, st] = field("Stop distance (price units)", 0.06);
  f2.append(a0, a1, a2); f2.style.marginTop = "20px";
  const calc2 = () => { const per = +st.value * +sz.value, budget = +cap.value * +rk.value / 100; out2.textContent = ""; out2.appendChild(outBox([["Risk budget", usd(budget)], ["Risk per contract at the stop", usd(per)], ["Contracts to trade", per > 0 ? String(Math.floor(budget / per)) : "–"]])); };
  [cap, rk, st, sz].forEach((i) => i.addEventListener("input", calc2)); c.addEventListener("change", calc2); calc2();
  box.append(el("h3", null, "Position size from a risk budget"), f2, out2); box.children[box.children.length - 3].style.marginTop = "22px";
}
function toolCarry(box) {
  const f = el("div", "form"), out = el("div"), [l0, S] = field("Spot price", 3000), [l1, r] = field("Interest rate, % a year", 5), [l2, u] = field("Storage, % a year", 2), [l3, y] = field("Convenience yield, % a year", 0), [l4, d] = field("Days ahead", 182), [l5, F] = field("Market forward price (optional)", "");
  f.append(l0, l1, l2, l3, l4, l5);
  const calc = () => { const T = +d.value / 365, fair = +S.value * Math.exp((+r.value + +u.value - +y.value) / 100 * T), full = +S.value * Math.exp((+r.value + +u.value) / 100 * T), rows = [["Fair forward price", fix(fair, 2)], ["Full-carry price (no convenience yield)", fix(full, 2)], ["Carry cost over the period", fix(full - +S.value, 2)]];
    if (F.value !== "" && +F.value > 0 && T > 0) { const iy = (+r.value + +u.value) / 100 - Math.log(+F.value / +S.value) / T; rows.push(["Implied convenience yield", fix(iy * 100, 2) + "% a year", iy > 0.02 ? "pos" : ""], ["Market shape", +F.value >= +S.value ? "Contango" : "Backwardation"]); }
