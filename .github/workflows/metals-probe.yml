name: Metals probe (temporary)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/metals-probe.mjs]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/metals-probe.mjs
