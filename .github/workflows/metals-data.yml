name: Update metals data

# Runs on the schedule below, when the script changes, or by hand from the Actions tab.
on:
  schedule:
    # Every half hour through the US trading day on weekdays, plus a few runs overnight and at weekends.
    # GitHub skips scheduled runs when it is busy, so there are more slots than strictly needed.
    - cron: "17,47 12-21 * * 1-5"
    - cron: "23 2,6,9,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/metals.mjs
      - .github/workflows/metals-data.yml

permissions:
  contents: write

concurrency:
  group: metals-data
  cancel-in-progress: false

jobs:
  metals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/metals.mjs
      - name: Save the new data
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/metals.json data/metals-live.json
          git diff --cached --quiet && exit 0
          git commit -m "Update metals data"
          git pull --rebase
          git push
