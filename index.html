<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@300;400;600&family=Unbounded:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a greenhouse control room at dusk. Deep forest glass panels,
   sunlight as the one bright accent, a sun dial in the hero that runs on the
   visitor's clock. Single theme by choice. */
:root {
  --bg: #071A16;
  --panel: #0E2A23;
  --line: #2A5A4B;
  --text: #E4F2E6;
  --muted: #93B5A5;
  --leaf: #7BE0A0;
  --sun: #F4C453;
  --font-display: "Unbounded", "Trebuchet MS", sans-serif;
  --font-body: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-weight: 300; font-size: 16px; line-height: 1.55;
  background-image:
    radial-gradient(900px 500px at 85% -10%, rgba(244, 196, 83, .13), transparent 70%),
    radial-gradient(700px 500px at 0% 100%, rgba(123, 224, 160, .08), transparent 70%);
  background-attachment: fixed;
}
#field { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 0 24px; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 22px 0; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-weight: 600; font-size: 17px; display: flex; align-items: center; gap: 10px; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 14px var(--sun); animation: pulse 3s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 4px var(--sun); opacity: .7; } }
nav { display: flex; flex-wrap: wrap; gap: 6px; }
nav a {
  color: var(--muted); text-decoration: none; padding: 6px 12px;
  border: 1px solid transparent; border-radius: 999px; transition: color .2s, border-color .2s;
}
nav a:hover { color: var(--leaf); border-color: var(--line); }

/* Hero */
.hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center; padding: 48px 0 40px; }
h1 {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(34px, 5.6vw, 62px); line-height: 1.05; letter-spacing: -.02em;
  margin: 14px 0 18px; text-wrap: balance;
}
h1 span { color: var(--sun); }
.lede { max-width: 44ch; margin: 0 0 24px; color: var(--muted); font-size: 17px; }
.stat { color: var(--leaf); }
.dial { width: 100%; max-width: 440px; justify-self: end; }
.dial svg { display: block; width: 100%; height: auto; overflow: visible; }
.dial .arc { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 3 7; }
.dial .ground { stroke: var(--line); stroke-width: 1.5; }
.dial .tick { stroke: var(--line); stroke-width: 1.5; }
.dial text { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; }
.dial .orb { fill: var(--sun); filter: drop-shadow(0 0 16px var(--sun)); }
.dial .halo { fill: none; stroke: var(--sun); stroke-opacity: .35; animation: halo 4s ease-out infinite; }
.dial.night .orb { fill: var(--text); filter: drop-shadow(0 0 12px var(--leaf)); }
.dial.night .halo { stroke: var(--leaf); }
@keyframes halo { from { r: 14; stroke-opacity: .5; } to { r: 44; stroke-opacity: 0; } }
.dial p { margin: 10px 0 0; text-align: right; color: var(--muted); }
.dial p b { color: var(--sun); font-weight: 500; }
.dial.night p b { color: var(--leaf); }

/* Search */
.search {
  width: 100%; max-width: 380px; font: inherit; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 11px 18px;
}
.search::placeholder { color: var(--muted); }
.search:focus { border-color: var(--leaf); outline: none; box-shadow: 0 0 0 3px rgba(123, 224, 160, .15); }

/* Sections */
section.cat { padding: 40px 0 8px; scroll-margin-top: 16px; }
.cat-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; padding-bottom: 16px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
.cat-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; }
.cat-head p { margin: 0; color: var(--muted); flex: 1 1 200px; }
.cat-head .mono { color: var(--leaf); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

/* Cards */
.card, .slot {
  border: 1px solid var(--line); border-radius: 14px;
  min-height: 200px; padding: 24px; display: flex; flex-direction: column; gap: 12px;
}
.card {
  --mx: 50%; --my: 0%;
  position: relative; color: inherit; text-decoration: none;
  background:
    radial-gradient(260px circle at var(--mx) var(--my), rgba(244, 196, 83, .16), transparent 70%),
    linear-gradient(160deg, #123329, var(--panel));
  transition: border-color .25s, translate .25s;
  animation: rise .6s ease-out backwards; animation-delay: calc(var(--i) * 70ms);
}
@keyframes rise { from { translate: 0 14px; } }
.card:hover { border-color: var(--sun); translate: 0 -3px; }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.glyph { width: 44px; height: 44px; flex: none; }
.glyph rect { fill: var(--leaf); transition: fill .25s; }
.card:hover .glyph rect { fill: var(--sun); }
.badge { color: var(--sun); border: 1px solid currentColor; border-radius: 999px; padding: 1px 9px; font-size: 11px; }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 18px; line-height: 1.25; margin: 4px 0 0; }
.card p { margin: 0; color: var(--muted); font-size: 14.5px; flex: 1; }
.go { color: var(--leaf); display: flex; align-items: center; gap: 8px; }
.go::after { content: "→"; transition: translate .2s; }
.card:hover .go { color: var(--sun); }
.card:hover .go::after { translate: 5px 0; }

.slot {
  justify-content: center; color: var(--muted);
  border-style: dashed;
  background: repeating-linear-gradient(135deg, transparent 0 10px, rgba(42, 90, 75, .28) 10px 11px);
}
.slot .mono { color: var(--leaf); }
.slot code { font-family: var(--font-mono); font-size: 13px; color: var(--text); }
.none { color: var(--muted); padding: 8px 0 0; }

.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding-bottom: 8px; }
.tile { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; color: inherit; text-decoration: none; transition: border-color .25s; }
a.tile:hover { border-color: var(--sun); }
.tile .mono { color: var(--muted); display: flex; align-items: center; gap: 8px; }
.tile .mono i { width: 8px; height: 8px; border-radius: 50%; background: var(--leaf); box-shadow: 0 0 10px var(--leaf); }
.tile .mono i.off { background: var(--muted); box-shadow: none; }
.tile strong { font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.tile small { color: var(--muted); font-size: 13px; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 110px 1fr; gap: 16px; padding: 12px 0; border-bottom: 1px solid rgba(42, 90, 75, .5); }
.log li:last-child { border-bottom: 0; }
.log time { color: var(--muted); }
footer { margin-top: 48px; padding: 20px 0 36px; border-top: 1px solid var(--line); color: var(--muted); }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; padding-top: 32px; }
  .dial { justify-self: start; max-width: 340px; }
  .dial p { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <div class="brand"><i></i><span id="brand"></span></div>
    <nav class="mono" id="nav" aria-label="Categories"></nav>
  </header>

  <section class="hero">
    <div>
      <div class="mono stat" id="stat" aria-live="polite"></div>
      <h1>Built here.<br><span>Runs anywhere.</span></h1>
      <p class="lede" id="tagline"></p>
      <input class="search" id="search" type="search" placeholder="Search apps" aria-label="Search apps" autocomplete="off" hidden>
    </div>
    <div class="dial" id="dial" aria-hidden="true">
      <svg viewBox="0 0 400 215">
        <path class="arc" d="M20 195 A180 170 0 0 1 380 195"/>
        <line class="ground" x1="0" y1="195" x2="400" y2="195"/>
        <line class="tick" x1="20" y1="189" x2="20" y2="201"/>
        <line class="tick" x1="200" y1="189" x2="200" y2="201"/>
        <line class="tick" x1="380" y1="189" x2="380" y2="201"/>
        <text x="20" y="214" text-anchor="middle" id="t0"></text>
        <text x="200" y="214" text-anchor="middle" id="t1"></text>
        <text x="380" y="214" text-anchor="middle" id="t2"></text>
        <g id="sun"><circle class="halo" r="14"/><circle class="orb" r="13"/></g>
      </svg>
      <p class="mono" id="clock"></p>
    </div>
  </section>

  <section class="board" id="board" aria-label="Status"></section>

  <main id="main"></main>

  <section class="cat" id="whats-new" hidden>
    <div class="cat-head"><h2>What's new</h2><p>Recent changes to this site.</p></div>
    <ul class="log" id="log"></ul>
  </section>

  <footer class="mono" id="foot"></footer>
</div>

<script src="apps.js"></script>
<script src="shop/items.js"></script>
<script>
const HUB = window.HUB || { title: "App Hub", tagline: "", categories: [], apps: [] };
const $ = (id) => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const SVG = "http://www.w3.org/2000/svg";

document.title = HUB.title;
$("brand").textContent = HUB.title;
$("tagline").textContent = HUB.tagline;
$("foot").textContent = HUB.title + " · " + new Date().getFullYear();
$("search").hidden = HUB.apps.length === 0;

HUB.categories.forEach((c) => {
  const a = el("a", null, c.name);
  a.href = "#" + c.id;
  $("nav").appendChild(a);
});

const shopLink = el("a", null, "Shop");
shopLink.href = "shop/";
$("nav").appendChild(shopLink);

/* Status board: one tile per live part of the site. */
function ago(iso) {
  const h = Math.round((Date.now() - new Date(iso)) / 36e5);
  return h < 1 ? "under an hour ago" : h < 48 ? h + (h === 1 ? " hour ago" : " hours ago") : Math.round(h / 24) + " days ago";
}
function stat(label, value, note, href, on) {
  const t = el(href ? "a" : "div", "tile");
  if (href) t.href = href;
  const head = el("span", "mono"), dot = el("i", on === false ? "off" : "");
  head.append(dot, label);
  t.append(head, el("strong", null, value), el("small", null, note));
  return t;
}
function renderBoard(status) {
  const board = $("board");
  board.textContent = "";
  const items = (window.SHOP && window.SHOP.items) || [];
  const open = items.filter((i) => (i.status || "available") !== "sold").length;
  board.append(
    stat("Apps", HUB.apps.length + " online", "in " + HUB.categories.length + " sections"),
    status
      ? stat("Market data", status.cards.toLocaleString() + " cards", "updated " + ago(status.updated), "tools/card-market/")
      : stat("Market data", "Waiting", "no snapshot loaded yet", "tools/card-market/", false),
    stat("Shop", open ? open + (open === 1 ? " item for sale" : " items for sale") : "Nothing listed", open ? "cash, friends first" : "check back soon", "shop/", open > 0)
  );
  const changes = (status && status.changes) || [];
  if (changes.length) {
    board.appendChild(stat("Latest change", changes[0].date, changes[0].text, "#whats-new"));
    $("whats-new").hidden = false;
    $("log").textContent = "";
    changes.slice(0, 8).forEach((c) => {
      const li = el("li"), time = el("time", "mono", c.date);
      li.append(time, el("span", null, c.text));
      $("log").appendChild(li);
    });
  }
}
renderBoard(null);
fetch("data/status.json").then((r) => (r.ok ? r.json() : null)).then((s) => { if (s) renderBoard(s); }).catch(() => {});

/* Each app gets its own symbol, generated from its name. */
function glyph(name) {
  let h = 2166136261;
  for (const ch of name) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("viewBox", "0 0 5 5");
  svg.setAttribute("class", "glyph");
  for (let y = 0; y < 5; y++) for (let x = 0; x < 3; x++) {
    if (!((h >> (y * 3 + x)) & 1)) continue;
    [x, 4 - x].forEach((px) => {
      const r = document.createElementNS(SVG, "rect");
      r.setAttribute("x", px + .08); r.setAttribute("y", y + .08);
      r.setAttribute("width", .84); r.setAttribute("height", .84); r.setAttribute("rx", .18);
      svg.appendChild(r);
    });
  }
  return svg;
}

function card(app, i) {
  const a = el("a", "card");
  a.href = app.url || "#";
  if (app.external) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
  a.style.setProperty("--i", i);
  const top = el("div", "card-top");
  top.appendChild(glyph(app.name));
  if (app.status) top.appendChild(el("span", "badge mono", app.status));
  a.append(top, el("h3", null, app.name), el("p", null, app.desc || ""), el("span", "go mono", app.external ? "Open" : "Launch"));
  a.addEventListener("pointermove", (e) => {
    const r = a.getBoundingClientRect();
    a.style.setProperty("--mx", e.clientX - r.left + "px");
    a.style.setProperty("--my", e.clientY - r.top + "px");
  });
  return a;
}

function render(query) {
  const q = (query || "").trim().toLowerCase();
  const main = $("main");
  main.textContent = "";
  let shown = 0;
  HUB.categories.forEach((c) => {
    const all = HUB.apps.filter((a) => a.category === c.id);
    const list = all.filter((a) => !q || (a.name + " " + (a.desc || "")).toLowerCase().includes(q));
    if (q && !list.length) return;
    shown += list.length;

    const sec = el("section", "cat");
    sec.id = c.id;
    const head = el("div", "cat-head");
    head.append(el("h2", null, c.name), el("p", null, c.blurb || ""),
      el("span", "mono", list.length + (list.length === 1 ? " app" : " apps")));
    const grid = el("div", "grid");
    list.forEach((a, i) => grid.appendChild(card(a, i)));
    if (!all.length) {
      const slot = el("div", "slot");
      slot.append(el("span", "mono", "Open slot"), el("span", null, "Nothing here yet. Apps added to apps.js with this category appear in this row:"));
      slot.appendChild(el("code", null, 'category: "' + c.id + '"'));
      grid.appendChild(slot);
    }
    sec.append(head, grid);
    main.appendChild(sec);
  });
  if (q && !shown) main.appendChild(el("p", "none", 'No apps match "' + query.trim() + '".'));
  const n = HUB.apps.length;
  $("stat").textContent = n ? n + (n === 1 ? " app online" : " apps online") : "Standing by for first app";
}
$("search").addEventListener("input", (e) => render(e.target.value));
render("");

/* Sun dial: runs on the visitor's own clock. Day arc 06:00 to 18:00, night arc 18:00 to 06:00. */
function tick() {
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  const day = h >= 6 && h < 18;
  const t = day ? (h - 6) / 12 : ((h + 6) % 24) / 12;
  const x = 200 - 180 * Math.cos(Math.PI * t), y = 195 - 170 * Math.sin(Math.PI * t);
  $("sun").setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ")");
  $("dial").classList.toggle("night", !day);
  $("t0").textContent = day ? "06:00" : "18:00";
  $("t1").textContent = day ? "12:00" : "00:00";
  $("t2").textContent = day ? "18:00" : "06:00";
  const hh = String(d.getHours()).padStart(2, "0"), mm = String(d.getMinutes()).padStart(2, "0");
  $("clock").innerHTML = "Your local time <b>" + hh + ":" + mm + "</b> · " + (day ? "running on sunlight" : "running on stored charge");
}
tick();
setInterval(tick, 30000);

/* Background: drifting pollen that links up near the cursor. */
(function field() {
  const cv = $("field"), ctx = cv.getContext("2d");
  let w, h, dpr, pts = [], mouse = { x: -999, y: -999 };
  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(70, Math.round(w * h / 22000));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .25, vy: -.08 - Math.random() * .22,
      r: .8 + Math.random() * 1.6, sun: Math.random() < .25
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
      if (p.x < -10) p.x = w + 10; else if (p.x > w + 10) p.x = -10;
      ctx.fillStyle = p.sun ? "rgba(244,196,83,.75)" : "rgba(123,224,160,.55)";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      const d = Math.hypot(p.x - mouse.x, p.y - mouse.y);
      if (d < 170) {
        ctx.strokeStyle = "rgba(244,196,83," + (.4 * (1 - d / 170)).toFixed(3) + ")";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      }
    }
    if (!reduced) requestAnimationFrame(draw);
  }
  addEventListener("resize", size);
  addEventListener("pointermove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  size(); draw();
})();
</script>
</body>
</html>
